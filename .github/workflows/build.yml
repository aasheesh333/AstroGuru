name: Build Android App

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Configure Keystore
      # The keystore is committed to the repo, so we just need to ensure key.properties is set up correctly.
      # Prioritize secrets if they exist, otherwise rely on the committed files.
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "Decoding keystore from secrets..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          # Only overwrite key.properties if we are using a custom keystore from secrets.
          # This avoids mismatching a secret password with the committed test keystore.
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Creating key.properties from secrets..."
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=../upload-keystore.jks" >> android/key.properties
          fi
        else
          echo "Using committed keystore (if present)..."
          # We assume the committed key.properties corresponds to the committed keystore.
          # We do NOT overwrite it with secrets here to avoid password mismatch errors.
        fi

        # Validation
        if [ ! -f android/upload-keystore.jks ]; then
          echo "Error: android/upload-keystore.jks not found!"
          exit 1
        fi
        if [ ! -f android/key.properties ]; then
          echo "Error: android/key.properties not found!"
          exit 1
        fi

    - name: Generate Env
      env:
        ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        chmod +x scripts/create_env.sh
        ./scripts/create_env.sh

    - name: Build APK
      env:
        PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        VERSION_CODE: ${{ secrets.VERSION_CODE }}
        VERSION_NAME: ${{ secrets.VERSION_NAME }}
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      run: flutter build apk --release -PPACKAGE_NAME=$PACKAGE_NAME -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME -PADMOB_APP_ID=$ADMOB_APP_ID

    - name: Build App Bundle
      env:
        PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        VERSION_CODE: ${{ secrets.VERSION_CODE }}
        VERSION_NAME: ${{ secrets.VERSION_NAME }}
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      run: flutter build appbundle --release -PPACKAGE_NAME=$PACKAGE_NAME -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME -PADMOB_APP_ID=$ADMOB_APP_ID

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: build/app/outputs/bundle/release/app-release.aab
