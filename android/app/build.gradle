plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Read env variables from project properties (passed via command line or CI)
// Dual-variable loading: Priority Local (APP_) -> CI (No prefix) -> Default

def appPackageName = project.hasProperty('APP_PACKAGE_NAME') ? project.property('APP_PACKAGE_NAME') : (project.hasProperty('PACKAGE_NAME') ? project.property('PACKAGE_NAME') : "com.dhanuk.astroprerna")

def appVersionCode = project.hasProperty('APP_VERSION_CODE') ? project.property('APP_VERSION_CODE').toInteger() : (project.hasProperty('VERSION_CODE') ? project.property('VERSION_CODE').toInteger() : 1)

def appVersionName = project.hasProperty('APP_VERSION_NAME') ? project.property('APP_VERSION_NAME') : (project.hasProperty('VERSION_NAME') ? project.property('VERSION_NAME') : "1.0.0")

// Allow local.properties overrides for Flutter specific checks
def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode != null) {
    appVersionCode = flutterVersionCode.toInteger()
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName != null) {
    appVersionName = flutterVersionName
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace appPackageName
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId appPackageName
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName

        // Inject keys into Manifest/BuildConfig
        def admobAppId = project.hasProperty('APP_ADMOB_APP_ID') ? project.property('APP_ADMOB_APP_ID') : (project.hasProperty('ADMOB_APP_ID') ? project.property('ADMOB_APP_ID') : "ca-app-pub-3940256099942544~3347511713")

        // Merge placeholders carefully
        manifestPlaceholders += [ADMOB_APP_ID: admobAppId]
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
