plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Read env variables from project properties (passed via command line or CI)
def appPackageName = project.hasProperty('APP_PACKAGE_NAME') ? project.property('APP_PACKAGE_NAME') : "com.dhanuk.astroprerna"
def appVersionCode = project.hasProperty('APP_VERSION_CODE') ? project.property('APP_VERSION_CODE').toInteger() : 1
def appVersionName = project.hasProperty('APP_VERSION_NAME') ? project.property('APP_VERSION_NAME') : "1.0.0"

// Allow local.properties overrides for Flutter specific checks
def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode != null) {
    appVersionCode = flutterVersionCode.toInteger()
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName != null) {
    appVersionName = flutterVersionName
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace appPackageName
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId appPackageName
        minSdkVersion 24
        targetSdkVersion 36
        versionCode appVersionCode
        versionName appVersionName

        // Inject keys into Manifest/BuildConfig
        def admobAppId = project.hasProperty('APP_ADMOB_APP_ID') ? project.property('APP_ADMOB_APP_ID') : "ca-app-pub-3940256099942544~3347511713" // Test ID default

        // Merge placeholders carefully
        manifestPlaceholders += [ADMOB_APP_ID: admobAppId]
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Ensure native libraries are stored uncompressed in the AAB so that AGP
    // can zip-align them on 16 KB boundaries (required for target SDK 36).
    // Combined with `android.bundle.enable16KbPageSize=true` in gradle.properties,
    // this satisfies Play Console's "16 KB memory page sizes" check.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

// ---------------------------------------------------------------------------
// 16 KB page-size alignment for sweph's libsweph.so
// ---------------------------------------------------------------------------
// The upstream `sweph` pub package (v2.10.3+18) compiles its native library
// with NDK r21, which sets `p_align=4096` in the ELF LOAD segments. Play
// Console rejects AABs targeting SDK 36 unless ALL PT_LOAD segments have
// `p_align >= 16384`. AGP's `android.bundle.enable16KbPageSize=true` only
// zip-aligns the .so entries inside the bundle; it does NOT modify the ELF
// p_align field, so sweph still fails Play Console's check.
//
// We patch the p_align header field in-place right after Gradle merges the
// native libs for the release variant, BEFORE the bundle is signed by the
// `signingConfigs.release` block. This keeps Gradle's native `apksigner`
// signing flow intact (the previous post-build jarsigner re-sign produced
// an "invalid signature" rejection on Play Console).
//
// Per https://developer.android.com/guide/practices/page-sizes#compile-16-kb
// the actual Play Console check is `p_align >= 16384`, not segment offset /
// vaddr alignment. The Android dynamic linker (API 21+ on 64-bit, API 24+ on
// 32-bit) tolerates p_align values larger than the actual page size used at
// runtime, so this in-place patch is runtime-safe.
tasks.register('patchSweph16KbAlignment') {
    def mergedDir = layout.buildDirectory.dir("intermediates/merged_native_libs/release/out/lib")
    def patchScript = rootProject.file('../scripts/patch_elf_page_size.py')
    inputs.dir(mergedDir)
    outputs.dir(mergedDir)
    doLast {
        if (!patchScript.exists()) {
            logger.warn("patchSweph16KbAlignment: patch script not found at ${patchScript}; skipping")
            return
        }
        mergedDir.get().asFile.eachFileRecurse { f ->
            if (f.name == 'libsweph.so') {
                logger.lifecycle("Patching 16 KB p_align for ${f}")
                project.exec {
                    executable 'python3'
                    args patchScript.absolutePath, f.absolutePath
                }
            }
        }
    }
}

// Hook the patch task into the release bundle pipeline AGP 8.x task graph:
//   mergeReleaseNativeLibs  ->  stripReleaseDebugSymbols  ->  packageRelease ...
// We depend on mergeReleaseLibs (rename for AGP 8.x) and let the patch
// produce patched outputs before packageRelease consumes them.
afterEvaluate {
    tasks.matching { it.name == 'mergeReleaseNativeLibs' }.configureEach {
        finalizedBy 'patchSweph16KbAlignment'
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
