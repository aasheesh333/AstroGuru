// The Android Gradle Plugin builds the native code with the Android NDK.

group 'org.duckdns.vm75.sweph'
version '3.2.0+2.10.3'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.1.2'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Namespace for Gradle version >= 8.0.0
    if (project.android.hasProperty("namespace")) {
        namespace("org.duckdns.vm75.sweph")
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36

    // Use NDK r27 so that the linker can produce 16 KB page-aligned ELF segments.
    // This is required by Google Play for apps targeting SDK 36 (Android 16).
    ndkVersion "27.0.12077973"

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path "../native/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16

        // 16 KB page-size alignment flags required by Play Console for target SDK 36.
        // These linker flags tell the NDK r27 linker to align PT_LOAD segments
        // to 16 KB boundaries. See https://developer.android.com/guide/practices/page-sizes
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cFlags ""
                cppFlags ""
            }
        }
        ndk {
            ldFlags "-Wl,-z,max-page-size=16384", "-Wl,-z,common-page-size=16384"
        }
    }
}
