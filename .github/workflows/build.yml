name: Build Android App (APK + AAB)

# This workflow intentionally builds ONLY Android artifacts.
# iOS builds are explicitly disabled (no ios/ directory in the repo).

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.3'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Patch sweph CMakeLists.txt to emit 16 KB page alignment
      # The upstream `sweph` pub package (v2.10.3+18) compiles libsweph.so
      # from C source via CMake + NDK r21. The default linker flags produce
      # `p_align=4096` for PT_LOAD segments, which Play Console rejects on
      # AABs targeting SDK 36 (it requires `p_align >= 16384` for all PT_LOAD
      # segments per https://developer.android.com/guide/practices/page-sizes).
      #
      # We append `-Wl,-z,max-page-size=16384` to the sweph target's linker
      # flags in the pub-cache copy of native/CMakeLists.txt BEFORE Gradle
      # builds it. NDK r21's lld (LLVM 9) supports this flag. Gradle's native
      # apksigner then signs the resulting AAB normally — no post-build
      # re-sign needed. Runtime-safe: the Linux loader tolerates p_align
      # larger than the actual page size.
      run: |
        set -e
        PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
        SWEPH_DIR="$(ls -d "$PUB_CACHE/hosted/pub.dev/sweph-"*/ 2>/dev/null || true)"
        if [ -z "$SWEPH_DIR" ]; then
          echo "::error::sweph plugin not found in pub cache"
          exit 1
        fi
        CMAKE_FILE="$SWEPH_DIR/native/CMakeLists.txt"
        if [ ! -f "$CMAKE_FILE" ]; then
          echo "::error::$CMAKE_FILE not found"
          exit 1
        fi

        # Idempotent: only append if not already patched.
        if grep -q "max-page-size=16384" "$CMAKE_FILE"; then
          echo "Already patched: $CMAKE_FILE"
        else
          echo "Patching $CMAKE_FILE"
          cat >> "$CMAKE_FILE" <<'EOF'

        # 16 KB page size alignment (Play Console requirement for SDK 36).
        # See https://developer.android.com/guide/practices/page-sizes
        target_link_options(sweph PRIVATE
            "-Wl,-z,max-page-size=16384"
            "-Wl,-z,common-page-size=16384")
        EOF
        fi

        echo "--- Patched CMakeLists.txt tail ---"
        tail -15 "$CMAKE_FILE"

    - name: Generate localizations
      run: flutter gen-l10n

    - name: Analyze
      run: flutter analyze --no-fatal-warnings --no-fatal-infos

    - name: Run tests
      run: flutter test --no-pub

    - name: Create Environment Files
      env:
        FIREBASE_JSON_BASE64: ${{ secrets.FIREBASE_JSON_BASE64 }}
        APP_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        APP_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        APP_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        APP_ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        APP_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        APP_ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
      run: |
        chmod +x scripts/create_env.sh
        bash scripts/create_env.sh

    - name: Configure Keystore
      # The keystore is committed to the repo, so we just need to ensure key.properties is set up correctly.
      # Prioritize secrets if they exist, otherwise rely on the committed files.
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
        else
          echo "Using committed keystore (if present)..."
        fi

        if [ -n "$KEYSTORE_PASSWORD" ]; then
          echo "Creating key.properties from secrets..."
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          # Default to key0 if alias is missing
          if [ -n "$KEY_ALIAS" ]; then
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          else
            echo "keyAlias=mykey" >> android/key.properties
          fi
          echo "storeFile=../upload-keystore.jks" >> android/key.properties
        else
          echo "Using committed key.properties (if present)..."
        fi

        # Validation
        if [ ! -f android/upload-keystore.jks ]; then
          echo "Error: android/upload-keystore.jks not found!"
          exit 1
        fi
        if [ ! -f android/key.properties ]; then
          echo "Error: android/key.properties not found!"
          exit 1
        fi

    - name: Build APK
      run: |
        flutter build apk --release \
          --build-number=${{ secrets.VERSION_CODE }} \
          --build-name=${{ secrets.VERSION_NAME }} \
          -PAPP_PACKAGE_NAME=${{ secrets.PACKAGE_NAME }} \
          -PAPP_ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }} \
          --dart-define=APP_ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }} \
          --dart-define=APP_ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }} \
          --dart-define=APP_ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID }} \
          --dart-define=APP_ADMOB_REWARDED_ID=${{ secrets.ADMOB_REWARDED_ID }} \
          --dart-define=APP_ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }} \
          --dart-define=APP_ONESIGNAL_API_KEY=${{ secrets.ONESIGNAL_API_KEY }}

    - name: Build App Bundle
      run: |
        flutter build appbundle --release \
          --build-number=${{ secrets.VERSION_CODE }} \
          --build-name=${{ secrets.VERSION_NAME }} \
          -PAPP_PACKAGE_NAME=${{ secrets.PACKAGE_NAME }} \
          -PAPP_ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }} \
          --dart-define=APP_ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }} \
          --dart-define=APP_ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }} \
          --dart-define=APP_ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID }} \
          --dart-define=APP_ADMOB_REWARDED_ID=${{ secrets.ADMOB_REWARDED_ID }} \
          --dart-define=APP_ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }} \
          --dart-define=APP_ONESIGNAL_API_KEY=${{ secrets.ONESIGNAL_API_KEY }}

    - name: Verify 16 KB p_align of libsweph.so in AAB
      # Verifies that the CMakeLists.txt patch (linker flag
      # `-Wl,-z,max-page-size=16384`) flowed through into the AAB built by
      # Gradle. Fails CI if any libsweph.so inside the bundle has a PT_LOAD
      # segment with `p_align < 16384`, which Play Console would reject.
      run: |
        set -e
        AAB="build/app/outputs/bundle/release/app-release.aab"
        TMP="$(mktemp -d)"

        echo "Extracting AAB to verify libsweph.so alignment..."
        unzip -q "$AAB" -d "$TMP/aab"

        echo "Checking alignment (must be p_align >= 16384 for all PT_LOAD segments)..."
        python3 scripts/check_elf_alignment.py \
              "$TMP/aab/base/lib/arm64-v8a/libsweph.so" \
              "$TMP/aab/base/lib/armeabi-v7a/libsweph.so" \
              "$TMP/aab/base/lib/x86/libsweph.so" \
              "$TMP/aab/base/lib/x86_64/libsweph.so" \
          > "$TMP/check.log" 2>&1 || true
        cat "$TMP/check.log"

        if grep -q "FAIL" "$TMP/check.log"; then
          echo "::error::libsweph.so 16 KB p_align patch failed to propagate into AAB"
          rm -rf "$TMP"
          exit 1
        fi

        rm -rf "$TMP"
        echo "Final AAB size: $(stat -c%s "$AAB") bytes"

    - name: Verify artifacts exist
      run: |
        set -e
        test -f build/app/outputs/flutter-apk/app-release.apk
        test -f build/app/outputs/bundle/release/app-release.aab
        echo "Artifacts verified."

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: build/app/outputs/bundle/release/app-release.aab
        if-no-files-found: error
        retention-days: 30
