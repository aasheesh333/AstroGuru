name: astroguru
description: AstroPrerna - Your personal AI-powered Vedic astrology companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  speech_to_text: ^7.3.0
  permission_handler: ^11.3.1
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  sweph: ^2.10.3+18
  shared_preferences: ^2.5.3
  crypto: ^3.0.3
  intl: ^0.19.0
  http: ^1.6.0
  google_mobile_ads: ^5.3.1
  onesignal_flutter: ^5.3.4
  provider: ^6.1.5+1
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.1.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  url_launcher: ^6.3.1
  firebase_storage: ^13.0.5
  package_info_plus: ^8.0.2
  shimmer: ^3.0.0
  geocoding: ^3.0.0
  in_app_review: ^2.0.0
  firebase_crashlytics: ^4.0.5
  firebase_analytics: ^11.0.5
  cloud_functions: ^5.0.5
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.4

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FDBD00"
  adaptive_icon_foreground: "assets/launcher/ic_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # NOTE: assets/.env is intentionally NOT bundled. All env values are
  # injected at build time via --dart-define in the CI workflow. Local dev
  # can `cp assets/.env.example assets/.env` and run with
  # `flutter run --dart-define-from-file=assets/.env`.
  generate: true
