name: Build Android App

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Create .env file
      env:
        ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        VERSION_CODE: ${{ github.run_number }}
        VERSION_NAME: "1.0.${{ github.run_number }}"
      run: |
        chmod +x scripts/create_env.sh
        ./scripts/create_env.sh

    - name: Configure Keystore
      # The keystore is committed to the repo, so we just need to ensure key.properties is set up correctly.
      # Prioritize secrets if they exist, otherwise rely on the committed files.
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
        else
          echo "Using committed keystore (if present)..."
        fi

        if [ -n "$KEYSTORE_PASSWORD" ]; then
          echo "Creating key.properties from secrets..."
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties

          if [ -n "$KEY_ALIAS" ]; then
             echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          else
             echo "keyAlias=mykey" >> android/key.properties
          fi

          echo "storeFile=../upload-keystore.jks" >> android/key.properties
        else
          echo "Using committed key.properties (if present)..."
        fi

        # Validation
        if [ ! -f android/upload-keystore.jks ]; then
          echo "Error: android/upload-keystore.jks not found!"
          exit 1
        fi
        if [ ! -f android/key.properties ]; then
          echo "Error: android/key.properties not found!"
          exit 1
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Build App Bundle
      run: flutter build appbundle --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: build/app/outputs/bundle/release/app-release.aab
