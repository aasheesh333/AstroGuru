name: astroguru
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  sweph: ^2.10.3+18
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  http: ^1.6.0
  google_mobile_ads: ^5.3.1
  onesignal_flutter: ^5.3.4
  flutter_dotenv: ^6.0.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FDBD00"
  adaptive_icon_foreground: "assets/launcher/ic_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/.env
  generate: true
