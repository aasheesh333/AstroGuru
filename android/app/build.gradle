plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Read env variables from project properties (passed via command line or CI)
def appPackageName = project.hasProperty('APP_PACKAGE_NAME') ? project.property('APP_PACKAGE_NAME') : "com.dhanuk.astroprerna"
def appVersionCode = project.hasProperty('APP_VERSION_CODE') ? project.property('APP_VERSION_CODE').toInteger() : 1
def appVersionName = project.hasProperty('APP_VERSION_NAME') ? project.property('APP_VERSION_NAME') : "1.0.0"

// Allow local.properties overrides for Flutter specific checks
def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode != null) {
    appVersionCode = flutterVersionCode.toInteger()
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName != null) {
    appVersionName = flutterVersionName
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace appPackageName
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId appPackageName
        minSdkVersion 24
        targetSdkVersion 36
        versionCode appVersionCode
        versionName appVersionName

        // Inject keys into Manifest/BuildConfig
        def admobAppId = project.hasProperty('APP_ADMOB_APP_ID') ? project.property('APP_ADMOB_APP_ID') : "ca-app-pub-3940256099942544~3347511713" // Test ID default

        // Merge placeholders carefully
        manifestPlaceholders += [ADMOB_APP_ID: admobAppId]
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Ensure native libraries are stored uncompressed in the AAB so that AGP
    // can zip-align them on 16 KB boundaries (required for target SDK 36).
    // Combined with `android.bundle.enable16KbPageSize=true` in gradle.properties,
    // this satisfies Play Console's "16 KB memory page sizes" check.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

// ---------------------------------------------------------------------------
// 16 KB page-size alignment for sweph's libsweph.so
// ---------------------------------------------------------------------------
// The upstream `sweph` pub package (v2.10.3+18) ships prebuilt .so files in
// its pub-cache directory with `p_align=4096` (compiled with NDK r21). Play
// Console rejects AABs targeting SDK 36 unless ALL PT_LOAD segments have
// `p_align >= 16384`.
//
// We do NOT patch in Gradle here — see `.github/workflows/build.yml` for the
// "Patch libsweph.so 16 KB p_align in pub cache" step which patches the
// prebuilt .so files right after `flutter pub get` (before any Gradle build
// runs). This way Gradle's native signing flow (`signingConfigs.release` +
// `apksigner`) is the only signing step and produces a signature that Play
// Console accepts.
flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
